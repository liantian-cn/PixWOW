[project]
name = "pixwow"
version = "0.1.0"
description = "Shared development environment for independent Pix WoW projects"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "opencv-python>=5.0.0.93",
    "psutil",
    "pyside6>=6.11.2",
    "xxhash>=4.0.1",
]

[dependency-groups]
dev = ["pyright>=1.1.414"]

[tool.uv]
package = false

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
pythonPlatform = "Windows"
venvPath = "."
venv = ".venv"
include = [
    "PixBlood/pix",
    "PixBeastMastery/pix",
    "PixHoly/pix",
    "PixProtection/pix",
    "PixRetribution/pix",
]
executionEnvironments = [
    { root = "PixBlood" },
    { root = "PixBeastMastery" },
    { root = "PixHoly" },
    { root = "PixProtection" },
    { root = "PixRetribution" },
]
